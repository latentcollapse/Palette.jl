[package]
name = "neurajl-host"
version = "0.1.0"
edition = "2021"
description = "NeuraJL host: the sandbox launcher, persistent session, and capability broker for the NeuraJL kernel"

[dependencies]
serde_json = "1"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
